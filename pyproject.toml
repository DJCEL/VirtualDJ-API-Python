[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "virtualdj-api"
version = "1.1.4"
description = "Control VirtualDJ software"
readme = "README.md"
authors = [
    {name = "djcel"},
]
requires-python = ">=3.12"
dependencies = [
  "httpx",
  "psutil",
  "rich",
]

[tool.setuptools.packages.find]
where = ["src"]